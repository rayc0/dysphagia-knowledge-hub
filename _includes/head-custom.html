<link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
<style>
/* Accessibility: ensure links in text blocks are underlined for non-color cues */
.markdown-body p a,.markdown-body li a,.markdown-body blockquote a{text-decoration:underline}
</style>
<script>
(function(){
  var loc = (window.location.pathname || '');
  if (loc === '/' || loc === '/index.html') {
    var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
    if (lang.startsWith('zh-hk') || lang.startsWith('zh-tw') || lang === 'zh-hant-tw' || lang === 'zh-hant-hk') {
      window.location.href = '/zh-hant-hk/';
    } else if (lang.startsWith('zh')) {
      window.location.href = '/zh-hans/';
    } else if (lang.startsWith('ja')) {
      window.location.href = '/ja/';
    } else if (lang.startsWith('ko')) {
      window.location.href = '/ko/';
    }
  }
})();

document.addEventListener('DOMContentLoaded',function(){
  // ---------- Language switcher bar (single source of truth site-wide) ----------
  var bar=document.createElement('div');
  bar.id='lang-bar';
  var langs=[['/zh-hans/','简体中文'],['/zh-hant/','繁體中文'],['/zh-hant-hk/','繁體中文(港)'],['/en/','English']];
  var p=window.location.pathname;
  bar.innerHTML=langs.map(function(pair,i){
    var active=p.indexOf(pair[0])===0?' class="active"':'';
    var sep=i>0?'<span class="sep">·</span>':'';
    return sep+'<a href="'+pair[0]+'"'+active+'>'+pair[1]+'</a>';
  }).join('');
  document.body.insertBefore(bar,document.body.firstChild);
  // ---------- Homepage topic cards: wrap each h3+ul pair, IDDSI palette cycle ----------
  var body=document.querySelector('.markdown-body');
  if(body){
    var heads=body.querySelectorAll('h3');
    if(heads.length>=3){
      var anchor=document.createComment('cat-grid-anchor');
      heads[0].parentNode.insertBefore(anchor,heads[0]);
      var grid=document.createElement('div');
      grid.className='cat-grid';
      var colorIdx=0;
      heads.forEach(function(h){
        var list=h.nextElementSibling;
        if(!list||list.tagName!=='UL')return;
        var card=document.createElement('div');
        card.className='cat-card';
        card.setAttribute('data-c',(colorIdx%7));
        colorIdx++;
        var tab=document.createElement('div');
        tab.className='cat-card__tab';
        var bodyDiv=document.createElement('div');
        bodyDiv.className='cat-card__body';
        var dot=document.createElement('span');
        dot.className='cat-dot';
        h.insertBefore(dot,h.firstChild);
        bodyDiv.appendChild(h);
        bodyDiv.appendChild(list);
        card.appendChild(tab);
        card.appendChild(bodyDiv);
        grid.appendChild(card);
      });
      if(grid.children.length>0){
        anchor.parentNode.insertBefore(grid,anchor);
      }
      anchor.parentNode.removeChild(anchor);
    }
  }

  // ---------- Article pages: auto-detect IDDSI level from the H1 and add a header band ----------
  // NOTE: the layout renders a site-title H1 link ahead of the content when
  // site.title != page.title, so the article's OWN title is the LAST h1, not the first.
  var h1s=body?body.querySelectorAll('h1'):[];
  var h1=h1s.length?h1s[h1s.length-1]:null;
  if(h1){
    var text=h1.textContent||'';
    var lvl=null;
    var m=text.match(/level\s*([0-7])\b/i);
    if(m){ lvl=m[1]; }
    if(lvl===null){ m=text.match(/(?:iddsi\s*)?第\s*([0-7])\s*级/); if(m){ lvl=m[1]; } }
    if(lvl===null){ m=text.match(/([0-7])\s*級/); if(m){ lvl=m[1]; } }
    if(lvl===null){ m=text.match(/([0-7])\s*级(?!\d)/); if(m && /iddsi/i.test(text)){ lvl=m[1]; } }
    var names={'0':'Thin','1':'Slightly Thick','2':'Mildly Thick','3':'Moderately Thick','4':'Pureed','5':'Minced & Moist','6':'Soft & Bite-Sized','7':'Regular / Easy to Chew'};
    if(lvl!==null && names[lvl]){
      var band=document.createElement('div');
      band.className='iddsi-band';
      band.setAttribute('data-level',lvl);
      band.innerHTML='<span class="iddsi-badge">'+lvl+'</span><span class="iddsi-band__label">IDDSI Level '+lvl+' — '+names[lvl]+'</span>';
      h1.parentNode.insertBefore(band,h1.nextSibling);
    }
  }

  // ---------- Founder footer ----------
  var f=document.createElement('p');
  f.style.cssText='font-size:0.8rem;color:var(--ink-soft,#9ca3af);text-align:center;margin:2.5rem 0 1.5rem;';
  f.innerHTML='Founded by <a href="https://ycchau.com/en/about/" rel="me" style="color:inherit;text-decoration:underline;">Raymond Chau Yik-Chun (周益俊)</a>.';
  document.body.appendChild(f);
});
</script>
